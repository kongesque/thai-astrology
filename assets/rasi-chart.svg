    <line x1="159.38" y1="549.00" x2="800.62" y2="549.00"/>
    <line x1="421.00" y1="431.00" x2="249.48" y2="259.48"/>
    <line x1="421.00" y1="549.00" x2="249.48" y2="720.52"/>
    <line x1="539.00" y1="431.00" x2="710.52" y2="259.48"/>
    <line x1="539.00" y1="549.00" x2="710.52" y2="720.52"/></g>
  <circle cx="480" cy="490" r="285" fill="none" stroke="#111" stroke-width="1.8"/>
