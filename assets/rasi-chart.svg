  <text class="sign" transform="translate(480.00 185.00) rotate(0)">เมษ</text>
  <text class="sign" transform="translate(327.50 225.86) rotate(-30)">พฤษภ</text>
  <text class="sign" transform="translate(215.86 337.50) rotate(-60)">เมถุน</text>
  <text class="sign" transform="translate(175.00 490.00) rotate(-90)">กรกฎ</text>
  <text class="sign" transform="translate(215.86 642.50) rotate(60)">สิงห์</text>
  <text class="sign" transform="translate(327.50 754.14) rotate(30)">กันย์</text>
  <text class="sign" transform="translate(480.00 795.00) rotate(0)">ตุลย์</text>
  <text class="sign" transform="translate(632.50 754.14) rotate(-30)">พิจิก</text>
  <text class="sign" transform="translate(744.14 642.50) rotate(-60)">ธนู</text>
